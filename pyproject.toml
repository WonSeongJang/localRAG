[project]
name = "localrag"
version = "0.1.0"
description = "Local RAG over Claude Code and Codex session logs"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.6",
    "requests>=2.31",
]

[project.scripts]
localrag = "localrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]
